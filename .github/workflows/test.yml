name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pytest==9.1.1 pytest-asyncio==1.4.0 pytest-cov==7.1.0

      - name: Run SQLite migration smoke
        run: |
          DATABASE_URL=sqlite+aiosqlite:///./data/ci_migration_smoke.db MIGRATION_FAIL_FAST=true alembic upgrade head

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        run: |
          pytest tests/ --cov=. --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install linters
        run: |
          pip install ruff==0.16.1 mypy==2.3.0

      - name: Run Ruff
        run: ruff check .

      - name: Run MyPy (advisory)
        run: |
          mypy --ignore-missing-imports . || echo "MyPy reported type issues; advisory only until the existing type debt is cleaned up."

      - name: Run mandatory type checks for critical state modules
        run: |
          mypy --python-version 3.12 --ignore-missing-imports --follow-imports=skip \
            --disable-error-code union-attr --disable-error-code attr-defined \
            --disable-error-code assignment \
            core/account_risk.py core/portfolio_risk.py core/redis_coordination.py \
            services/order_reconciler.py services/signal_processor.py services/webhook_worker.py

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Audit locked runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.1
          pip-audit -r requirements.lock

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t signal-server:test .

      - name: Validate Docker Compose configs
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
        run: |
          cp .env.example .env
          docker compose config
          docker compose --profile updates config

      - name: Smoke-test Docker image (import only)
        # Run a quick import check without needing a real DB or Redis.
        # Full runtime health-check requires postgres+redis; tested in postgres-migration job.
        run: |
          docker run --rm \
            -e DATABASE_URL=sqlite+aiosqlite:///./data/ci_smoke.db \
            -e SKIP_MIGRATIONS=true \
            signal-server:test \
            python -c "import app; print('Docker image OK')"

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signal
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: signal_server
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signal -d signal_server"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pytest==9.1.1 pytest-asyncio==1.4.0

      - name: Run PostgreSQL migration smoke
        env:
          DATABASE_URL: postgresql+asyncpg://signal:ci-postgres-password@localhost:5432/signal_server
          REDIS_URL: redis://localhost:6379/0
          REDIS_ENABLED: "true"
          MIGRATION_FAIL_FAST: "true"
        run: alembic upgrade head

      - name: Run live-pipeline tests on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://signal:ci-postgres-password@localhost:5432/signal_server
          ALLOW_EXTERNAL_TEST_DATABASE: "true"
          REDIS_URL: redis://localhost:6379/0
          REDIS_ENABLED: "true"
        run: pytest tests/test_live_pipeline_hardening.py tests/test_account_risk.py -q
