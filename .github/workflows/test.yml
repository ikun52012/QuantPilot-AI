name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx pytest-cov

      - name: Run SQLite migration smoke
        run: |
          DATABASE_URL=sqlite+aiosqlite:///./data/ci_migration_smoke.db MIGRATION_FAIL_FAST=true alembic upgrade head

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        run: |
          pip install pytest-cov
          pytest tests/ --cov=. --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install linters
        run: |
          pip install ruff mypy

      - name: Run Ruff
        run: ruff check .

      - name: Run MyPy (advisory)
        run: |
          mypy --ignore-missing-imports . || echo "MyPy reported type issues; advisory only until the existing type debt is cleaned up."

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t signal-server:test .

      - name: Validate Docker Compose configs
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
        run: |
          docker compose config
          docker compose --profile updates config

      - name: Test Docker image
        run: |
          docker run -d --name test-container -p 8000:8000 signal-server:test
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              docker logs test-container || true
              exit 1
            fi
            sleep 1
          done
          docker stop test-container
          docker rm test-container

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signal
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: signal_server
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signal -d signal_server"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PostgreSQL migration smoke
        env:
          DATABASE_URL: postgresql+asyncpg://signal:ci-postgres-password@localhost:5432/signal_server
          REDIS_URL: redis://localhost:6379/0
          REDIS_ENABLED: true
          MIGRATION_FAIL_FAST: true
        run: alembic upgrade head
