name: Repair v5.4.0 Release

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/repair-v5-4-0.yml'
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 5

      - name: Verify source app image
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/quantpilot-ai:sha-36b8a43

      - name: Tag app image as v5.4.0
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/quantpilot-ai:v5.4.0 \
            ghcr.io/${{ github.repository_owner }}/quantpilot-ai:sha-36b8a43

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.4.0
          name: v5.4.0
          generate_release_notes: true
          body: |
            Docker images:
            - `ghcr.io/${{ github.repository_owner }}/quantpilot-ai:v5.4.0`
            - `ghcr.io/${{ github.repository_owner }}/quantpilot-ai-updater:v5.4.0`
