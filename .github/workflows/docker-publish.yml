name: Docker Publish

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signal
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: signal_server
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signal -d signal_server"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx ruff

      - name: Run Ruff
        run: ruff check .

      - name: Run PostgreSQL migration smoke
        env:
          DATABASE_URL: postgresql+asyncpg://signal:ci-postgres-password@localhost:5432/signal_server
          MIGRATION_FAIL_FAST: "true"
        run: alembic upgrade head

      - name: Run tests
        run: pytest tests/ -q

  publish-app:
    runs-on: ubuntu-latest
    needs: quality-gate
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta_app
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/quantpilot-ai
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        timeout-minutes: 45
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta_app.outputs.tags }}
          labels: ${{ steps.meta_app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-updater:
    runs-on: ubuntu-latest
    needs: quality-gate
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract updater metadata
        id: meta_updater
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/quantpilot-ai-updater
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push updater
        uses: docker/build-push-action@v6
        timeout-minutes: 30
        with:
          context: .
          file: ./Dockerfile.updater
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta_updater.outputs.tags }}
          labels: ${{ steps.meta_updater.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-app, publish-updater]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Docker images:
            - `ghcr.io/${{ github.repository_owner }}/quantpilot-ai:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/quantpilot-ai-updater:${{ github.ref_name }}`
